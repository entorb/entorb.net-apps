<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Converter: nm to eV to cm^-1 to THz" />
  <title data-i18n="title">nm to eV Converter</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main>
    <button type="button" id="lang" style="float: right">EN</button>

    <h1 data-i18n="title">nm to eV Converter</h1>

    <p data-i18n="intro">Convert between wavelength (nm), energy (eV), wavenumber (cm<sup>-1</sup>) and frequency (THz).</p>
    <form id="form" class="row">
      <label><span data-i18n="p1">Point 1</span>: <input id="pnt1" inputmode="decimal" size="9" /></label>
      <label><span data-i18n="p2">Point 2</span>: <input id="pnt2" inputmode="decimal" size="9" /></label>
      <label><span data-i18n="unit">Unit</span>: <select id="unit">
          <option value="nm">nm</option>
          <option value="eV">eV</option>
          <option value="cm">cm-1</option>
          <option value="THz">THz</option>
        </select>
      </label>
      <button type="submit" data-i18n="convert">Convert</button>
    </form>
    <table id="result" hidden>
      <thead>
        <tr>
          <th data-i18n="p1">Point 1</th>
          <th data-i18n="p2">Point 2</th>
          <th>P2-P1</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <footer class="foot">
    <a href="/" data-i18n="home">Home</a> - <a href="/contact.php?origin=nm2eV" data-i18n="contact">Contact</a> - <a href="https://github.com/entorb/entorb.net-apps/tree/main/tools" target="_blank" rel="noopener">GitHub</a> - <span data-i18n="uses">Conversions</span>: <span id="use-count"></span>
  </footer>
  <script type="module" src="nm2eV.js"></script>
</body>

</html>
