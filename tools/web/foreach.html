<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Foreach generator" />
    <title data-i18n="title">Foreach Generator</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <button type="button" id="lang" style="float: right">EN</button>
      <h1 data-i18n="title">Foreach Generator</h1>
      <p data-i18n="intro">Replace %A% and %B% in the text by each line of the lists.</p>
      <form id="form">
        <div class="grid">
          <label
            >Text
            <textarea id="text" rows="10" wrap="off">Der %A% ist %B%.</textarea>
          </label>
          <label
            >%A%
            <textarea id="list-a" rows="10">
Baum
Hut
Mensch</textarea
            >
          </label>
          <label
            >%B%
            <textarea id="list-b" rows="10">
rot
grün
blau</textarea
            >
          </label>
        </div>
        <div class="row">
          <button type="submit" value="cartesian" data-i18n="cartesian">Cartesian Product</button>
          <span data-i18n="or">or</span>
          <button type="submit" value="scalar" data-i18n="scalar">Scalar Product</button>
          <label><input type="checkbox" id="separate" checked /> <span data-i18n="separate">separate sets by empty lines</span></label>
        </div>
      </form>
      <p id="error" class="error" role="alert"></p>
      <label for="output" data-i18n="output">Generated Text</label>
      <textarea id="output" rows="10" readonly></textarea>
    </main>
    <footer class="foot">
      <a href="/" data-i18n="home">Home</a> - <a href="/contact.php?origin=Foreach" data-i18n="contact">Contact</a> -
      <a href="https://github.com/entorb/entorb.net-apps/tree/main/tools" target="_blank" rel="noopener">GitHub</a> -
      <span data-i18n="uses">Uses</span>: <span id="use-count"></span>
    </footer>
    <script type="module" src="foreach.js"></script>
  </body>
</html>
